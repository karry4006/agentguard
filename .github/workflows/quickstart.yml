name: AgentGuard Quick Start

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-quickstart:
    name: Fresh Compose Quick Start smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SDK runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable sdk/python
      - name: Generate disposable development configuration
        shell: pwsh
        run: ./scripts/bootstrap-dev.ps1 -OutputDirectory .docker-local/quickstart
      - name: Start Compose and verify migration
        shell: pwsh
        run: |
          docker compose --env-file .docker-local/quickstart/.env -p agentguard-ci-quickstart up --build -d
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $health = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8000/health -TimeoutSec 2
              if ($health.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw "AgentGuard health endpoint did not become ready" }
      - name: Create tenant and run basic no-paid-API demo
        shell: pwsh
        run: |
          $compose = @("--env-file", ".docker-local/quickstart/.env", "-p", "agentguard-ci-quickstart")
          & docker compose @compose exec -T agentguard-server /usr/bin/python3.13 -m agentguard_server.cli tenant create --slug ci-demo --name "CI Demo"
          $keyOutput = & docker compose @compose exec -T agentguard-server /usr/bin/python3.13 -m agentguard_server.cli key create --tenant ci-demo --name ci-basic-demo --scopes "ingest:write,traces:read,dashboard:access,incidents:read,integrity:read"
          $keyLine = @($keyOutput | Where-Object { $_ -match "^api_key=" })
          if ($keyLine.Count -ne 1) { throw "AgentGuard API key creation did not return one key" }
          $env:AGENTGUARD_API_KEY = $keyLine[0].Substring(8).Trim()
          $env:AGENTGUARD_INGEST_URL = "http://127.0.0.1:8000/v1/ingest"
          $separator = [IO.Path]::PathSeparator
          $env:PYTHONPATH = "$((Get-Location).Path)/sdk/python/src$separator$((Get-Location).Path)/server/src"
          $demo = & python examples/basic_agent/demo.py
          if ($LASTEXITCODE -ne 0 -or @($demo | Where-Object { $_ -match "^trace_id=" }).Count -ne 1) { throw "Basic demo failed" }
          $traces = Invoke-RestMethod -Uri http://127.0.0.1:8000/v1/traces -Headers @{ Authorization = "Bearer " + $env:AGENTGUARD_API_KEY }
          if (@($traces.traces).Count -lt 1) { throw "No trace was visible through the API" }
      - name: Stop disposable Compose project
        if: always()
        shell: pwsh
        run: docker compose --env-file .docker-local/quickstart/.env -p agentguard-ci-quickstart stop
