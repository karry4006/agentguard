[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0a1"
description = "Vendor-neutral AI Agent flight recorder SDK"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "opentelemetry-sdk>=1.28,<2"]

[project.optional-dependencies]
openai = ["openai-agents>=0.0.10"]
test = ["pytest>=8", "opentelemetry-exporter-otlp-proto-http>=1.28,<2"]

[project.urls]
Homepage = "https://github.com/karry4006/agentguard"
Repository = "https://github.com/karry4006/agentguard"
Issues = "https://github.com/karry4006/agentguard/issues"

[tool.setuptools.packages.find]
where = ["src"]
