services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AGENTGUARD_RUNTIME_USER: ${AGENTGUARD_RUNTIME_USER:-agentguard_runtime}
      AGENTGUARD_RUNTIME_PASSWORD: ${AGENTGUARD_RUNTIME_PASSWORD:?Set AGENTGUARD_RUNTIME_PASSWORD}
      AGENTGUARD_MIGRATION_USER: ${AGENTGUARD_MIGRATION_USER:-agentguard_migration}
      AGENTGUARD_MIGRATION_PASSWORD: ${AGENTGUARD_MIGRATION_PASSWORD:?Set AGENTGUARD_MIGRATION_PASSWORD}
      AGENTGUARD_RETENTION_USER: ${AGENTGUARD_RETENTION_USER:-agentguard_retention}
      AGENTGUARD_RETENTION_PASSWORD: ${AGENTGUARD_RETENTION_PASSWORD:?Set AGENTGUARD_RETENTION_PASSWORD}
      AGENTGUARD_LEDGER_COMPACTOR_USER: ${AGENTGUARD_LEDGER_COMPACTOR_USER:-agentguard_ledger_compactor}
      AGENTGUARD_LEDGER_COMPACTOR_PASSWORD: ${AGENTGUARD_LEDGER_COMPACTOR_PASSWORD:?Set AGENTGUARD_LEDGER_COMPACTOR_PASSWORD}
      AGENTGUARD_ARCHIVE_REPLICATION_USER: ${AGENTGUARD_ARCHIVE_REPLICATION_USER:-agentguard_replication_worker}
      AGENTGUARD_ARCHIVE_REPLICATION_PASSWORD: ${AGENTGUARD_ARCHIVE_REPLICATION_PASSWORD:?Set AGENTGUARD_ARCHIVE_REPLICATION_PASSWORD}
      AGENTGUARD_INTEGRITY_COMPACTOR_USER: ${AGENTGUARD_INTEGRITY_COMPACTOR_USER:-agentguard_integrity_compactor}
      AGENTGUARD_INTEGRITY_COMPACTOR_PASSWORD: ${AGENTGUARD_INTEGRITY_COMPACTOR_PASSWORD:?Set AGENTGUARD_INTEGRITY_COMPACTOR_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentguard-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      backend:
        aliases: [postgres]
    mem_limit: 1g

  agentguard-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      AGENTGUARD_MIGRATION_DATABASE_URL: ""
      AGENTGUARD_MIGRATION_DATABASE_URL_FILE: /run/secrets/agentguard_migration_database_url
    # Distroless supplies Python as the image entrypoint; pass only argv.
    command: ["-m", "alembic", "upgrade", "head"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    networks:
      backend:
        aliases: [agentguard-migrate]
    mem_limit: 256m
    secrets:
      - source: agentguard_migration_database_url
        target: agentguard_migration_database_url
    depends_on:
      postgres:
        condition: service_healthy

  agentguard-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_database_url
      AGENTGUARD_CAPTURE_CONTENT: ${AGENTGUARD_CAPTURE_CONTENT:-false}
      AGENTGUARD_KEY_PEPPER: ""
      AGENTGUARD_KEY_PEPPER_FILE: /run/secrets/agentguard_key_pepper
      AGENTGUARD_INTEGRITY_KEY: ""
      AGENTGUARD_INTEGRITY_KEY_FILE: /run/secrets/agentguard_integrity_key
      AGENTGUARD_INTEGRITY_KEY_ID: ${AGENTGUARD_INTEGRITY_KEY_ID:-v1}
      AGENTGUARD_INTEGRITY_VERIFY_KEYS: ${AGENTGUARD_INTEGRITY_VERIFY_KEYS:-}
      AGENTGUARD_REQUEST_MAX_BYTES: ${AGENTGUARD_REQUEST_MAX_BYTES:-1048576}
      AGENTGUARD_OTLP_MAX_COMPRESSED_BYTES: ${AGENTGUARD_OTLP_MAX_COMPRESSED_BYTES:-1048576}
      AGENTGUARD_OTLP_MAX_DECOMPRESSED_BYTES: ${AGENTGUARD_OTLP_MAX_DECOMPRESSED_BYTES:-4194304}
      AGENTGUARD_OTLP_MAX_RESOURCE_SPANS: ${AGENTGUARD_OTLP_MAX_RESOURCE_SPANS:-100}
      AGENTGUARD_OTLP_MAX_SCOPE_SPANS: ${AGENTGUARD_OTLP_MAX_SCOPE_SPANS:-1000}
      AGENTGUARD_OTLP_MAX_SPANS: ${AGENTGUARD_OTLP_MAX_SPANS:-1000}
      AGENTGUARD_OTLP_MAX_ATTRIBUTES: ${AGENTGUARD_OTLP_MAX_ATTRIBUTES:-64}
      AGENTGUARD_OTLP_MAX_EVENTS: ${AGENTGUARD_OTLP_MAX_EVENTS:-128}
      AGENTGUARD_OTLP_MAX_LINKS: ${AGENTGUARD_OTLP_MAX_LINKS:-128}
      AGENTGUARD_OTLP_MAX_ATTRIBUTE_KEY_LENGTH: ${AGENTGUARD_OTLP_MAX_ATTRIBUTE_KEY_LENGTH:-128}
      AGENTGUARD_OTLP_MAX_ATTRIBUTE_VALUE_LENGTH: ${AGENTGUARD_OTLP_MAX_ATTRIBUTE_VALUE_LENGTH:-2048}
      AGENTGUARD_OTLP_MAX_METADATA_BYTES: ${AGENTGUARD_OTLP_MAX_METADATA_BYTES:-16384}
      AGENTGUARD_OTLP_MAX_ANYVALUE_DEPTH: ${AGENTGUARD_OTLP_MAX_ANYVALUE_DEPTH:-8}
      AGENTGUARD_OTLP_MAX_ANYVALUE_ITEMS: ${AGENTGUARD_OTLP_MAX_ANYVALUE_ITEMS:-128}
      AGENTGUARD_INGEST_RATE_LIMIT: ${AGENTGUARD_INGEST_RATE_LIMIT:-120}
      AGENTGUARD_READ_RATE_LIMIT: ${AGENTGUARD_READ_RATE_LIMIT:-300}
      AGENTGUARD_RATE_LIMIT_WINDOW_SECONDS: ${AGENTGUARD_RATE_LIMIT_WINDOW_SECONDS:-60}
      AGENTGUARD_ANALYSIS_ENABLED: ${AGENTGUARD_ANALYSIS_ENABLED:-true}
      AGENTGUARD_ANALYSIS_MODEL: ${AGENTGUARD_ANALYSIS_MODEL:-disabled-by-default-judge}
      AGENTGUARD_ANALYSIS_MAX_SPANS: ${AGENTGUARD_ANALYSIS_MAX_SPANS:-200}
      AGENTGUARD_ANALYSIS_MAX_EVENTS: ${AGENTGUARD_ANALYSIS_MAX_EVENTS:-500}
      AGENTGUARD_ANALYSIS_MAX_INPUT_BYTES: ${AGENTGUARD_ANALYSIS_MAX_INPUT_BYTES:-65536}
      AGENTGUARD_ANALYSIS_TIMEOUT_SECONDS: ${AGENTGUARD_ANALYSIS_TIMEOUT_SECONDS:-5}
      AGENTGUARD_ANALYSIS_MAX_MODEL_CALLS: ${AGENTGUARD_ANALYSIS_MAX_MODEL_CALLS:-1}
      AGENTGUARD_ANALYSIS_MAX_OUTPUT_BYTES: ${AGENTGUARD_ANALYSIS_MAX_OUTPUT_BYTES:-16384}
      AGENTGUARD_ANALYSIS_MAX_CONCURRENT: ${AGENTGUARD_ANALYSIS_MAX_CONCURRENT:-2}
      AGENTGUARD_ANALYSIS_RATE_LIMIT: ${AGENTGUARD_ANALYSIS_RATE_LIMIT:-10}
      AGENTGUARD_ALLOW_PRIVATE_WEBHOOK_TESTS: ${AGENTGUARD_ALLOW_PRIVATE_WEBHOOK_TESTS:-false}
      AGENTGUARD_NOTIFICATION_SIGNING_SECRET: ""
      AGENTGUARD_NOTIFICATION_ALLOWED_WEBHOOK_HOSTS: ${AGENTGUARD_NOTIFICATION_ALLOWED_WEBHOOK_HOSTS:-}
      AGENTGUARD_NOTIFICATION_TENANT_RATE_LIMIT: ${AGENTGUARD_NOTIFICATION_TENANT_RATE_LIMIT:-60}
      AGENTGUARD_NOTIFICATION_MAX_DESTINATIONS: ${AGENTGUARD_NOTIFICATION_MAX_DESTINATIONS:-50}
      AGENTGUARD_NOTIFICATION_MAX_POLICIES: ${AGENTGUARD_NOTIFICATION_MAX_POLICIES:-100}
      AGENTGUARD_NOTIFICATION_MAX_PENDING: ${AGENTGUARD_NOTIFICATION_MAX_PENDING:-1000}
      AGENTGUARD_NOTIFICATION_RETRY_MAX_ATTEMPTS: ${AGENTGUARD_NOTIFICATION_RETRY_MAX_ATTEMPTS:-3}
      AGENTGUARD_NOTIFICATION_RETRY_BASE_SECONDS: ${AGENTGUARD_NOTIFICATION_RETRY_BASE_SECONDS:-5}
      AGENTGUARD_NOTIFICATION_RETRY_MAX_DELAY_SECONDS: ${AGENTGUARD_NOTIFICATION_RETRY_MAX_DELAY_SECONDS:-300}
      AGENTGUARD_NOTIFICATION_CIRCUIT_FAILURE_THRESHOLD: ${AGENTGUARD_NOTIFICATION_CIRCUIT_FAILURE_THRESHOLD:-5}
      AGENTGUARD_NOTIFICATION_CIRCUIT_OPEN_SECONDS: ${AGENTGUARD_NOTIFICATION_CIRCUIT_OPEN_SECONDS:-60}
      AGENTGUARD_DASHBOARD_API_KEY_LOGIN_ENABLED: ${AGENTGUARD_DASHBOARD_API_KEY_LOGIN_ENABLED:-false}
      AGENTGUARD_OIDC_ENABLED: ${AGENTGUARD_OIDC_ENABLED:-false}
      AGENTGUARD_OIDC_ISSUER: ${AGENTGUARD_OIDC_ISSUER:-}
      AGENTGUARD_OIDC_CLIENT_ID: ${AGENTGUARD_OIDC_CLIENT_ID:-}
      AGENTGUARD_OIDC_REDIRECT_URI: ${AGENTGUARD_OIDC_REDIRECT_URI:-}
      AGENTGUARD_OIDC_ALLOWED_AUDIENCES: ${AGENTGUARD_OIDC_ALLOWED_AUDIENCES:-}
      AGENTGUARD_OIDC_ALLOWED_ALGORITHMS: ${AGENTGUARD_OIDC_ALLOWED_ALGORITHMS:-RS256}
      AGENTGUARD_OIDC_REQUIRED_CLAIMS: ${AGENTGUARD_OIDC_REQUIRED_CLAIMS:-sub}
      AGENTGUARD_ENVIRONMENT: ${AGENTGUARD_ENVIRONMENT:-development}
      AGENTGUARD_DB_POOL_SIZE: ${AGENTGUARD_DB_POOL_SIZE:-5}
      AGENTGUARD_DB_MAX_OVERFLOW: ${AGENTGUARD_DB_MAX_OVERFLOW:-10}
      AGENTGUARD_DB_POOL_TIMEOUT_SECONDS: ${AGENTGUARD_DB_POOL_TIMEOUT_SECONDS:-10}
      AGENTGUARD_DB_CONNECT_TIMEOUT_SECONDS: ${AGENTGUARD_DB_CONNECT_TIMEOUT_SECONDS:-5}
      AGENTGUARD_DB_STATEMENT_TIMEOUT_MS: ${AGENTGUARD_DB_STATEMENT_TIMEOUT_MS:-30000}
      AGENTGUARD_SHUTDOWN_TIMEOUT_SECONDS: ${AGENTGUARD_SHUTDOWN_TIMEOUT_SECONDS:-10}
      AGENTGUARD_INSTANCE_ID: ${AGENTGUARD_INSTANCE_ID:-agentguard-server}
      AGENTGUARD_NOTIFICATION_LEASE_SECONDS: ${AGENTGUARD_NOTIFICATION_LEASE_SECONDS:-30}
      AGENTGUARD_NOTIFICATION_CIRCUIT_PROBE_LEASE_SECONDS: ${AGENTGUARD_NOTIFICATION_CIRCUIT_PROBE_LEASE_SECONDS:-30}
      AGENTGUARD_EVALUATION_MAX_CASES: ${AGENTGUARD_EVALUATION_MAX_CASES:-1000}
      AGENTGUARD_EVALUATION_MAX_RULES: ${AGENTGUARD_EVALUATION_MAX_RULES:-64}
      AGENTGUARD_EVALUATION_RATE_LIMIT: ${AGENTGUARD_EVALUATION_RATE_LIMIT:-30}
      AGENTGUARD_REPLAY_MAX_STEPS: ${AGENTGUARD_REPLAY_MAX_STEPS:-1000}
      AGENTGUARD_REPLAY_MAX_INPUT_BYTES: ${AGENTGUARD_REPLAY_MAX_INPUT_BYTES:-65536}
      AGENTGUARD_REPLAY_MAX_DURATION_SECONDS: ${AGENTGUARD_REPLAY_MAX_DURATION_SECONDS:-5}
      AGENTGUARD_REPLAY_MAX_CONCURRENT: ${AGENTGUARD_REPLAY_MAX_CONCURRENT:-4}
      AGENTGUARD_ANCHOR_ENABLED: ${AGENTGUARD_ANCHOR_ENABLED:-false}
      AGENTGUARD_ANCHOR_ENDPOINT: ${AGENTGUARD_ANCHOR_ENDPOINT:-}
      AGENTGUARD_ANCHOR_NAMESPACE: ${AGENTGUARD_ANCHOR_NAMESPACE:-agentguard-development}
      AGENTGUARD_ANCHOR_VERIFY_KEYS: ${AGENTGUARD_ANCHOR_VERIFY_KEYS:-}
      AGENTGUARD_ANCHOR_VERIFY_KEYS_FILE: ${AGENTGUARD_ANCHOR_VERIFY_KEYS_FILE:-}
      AGENTGUARD_ANCHOR_INTERVAL_SECONDS: ${AGENTGUARD_ANCHOR_INTERVAL_SECONDS:-300}
      AGENTGUARD_ANCHOR_MAX_AGE_SECONDS: ${AGENTGUARD_ANCHOR_MAX_AGE_SECONDS:-900}
      AGENTGUARD_ANCHOR_REQUEST_TIMEOUT_SECONDS: ${AGENTGUARD_ANCHOR_REQUEST_TIMEOUT_SECONDS:-5}
      AGENTGUARD_ANCHOR_LEASE_SECONDS: ${AGENTGUARD_ANCHOR_LEASE_SECONDS:-30}
      AGENTGUARD_ANCHOR_RETRY_BASE_SECONDS: ${AGENTGUARD_ANCHOR_RETRY_BASE_SECONDS:-1}
      AGENTGUARD_ANCHOR_RETRY_MAX_SECONDS: ${AGENTGUARD_ANCHOR_RETRY_MAX_SECONDS:-60}
      AGENTGUARD_ANCHOR_MAX_ATTEMPTS: ${AGENTGUARD_ANCHOR_MAX_ATTEMPTS:-5}
      AGENTGUARD_ANCHOR_MAX_ENTRIES: ${AGENTGUARD_ANCHOR_MAX_ENTRIES:-10000}
      AGENTGUARD_ANCHOR_MAX_PENDING_JOBS: ${AGENTGUARD_ANCHOR_MAX_PENDING_JOBS:-1}
      AGENTGUARD_ALLOW_PRIVATE_ANCHOR_TESTS: ${AGENTGUARD_ALLOW_PRIVATE_ANCHOR_TESTS:-false}
      AGENTGUARD_ARCHIVE_ENABLED: ${AGENTGUARD_ARCHIVE_ENABLED:-false}
      AGENTGUARD_RETENTION_PURGE_ENABLED: ${AGENTGUARD_RETENTION_PURGE_ENABLED:-false}
      AGENTGUARD_ARCHIVE_AFTER_DAYS: ${AGENTGUARD_ARCHIVE_AFTER_DAYS:-30}
      AGENTGUARD_PURGE_AFTER_DAYS: ${AGENTGUARD_PURGE_AFTER_DAYS:-90}
      AGENTGUARD_RETENTION_FINALIZATION_GRACE_DAYS: ${AGENTGUARD_RETENTION_FINALIZATION_GRACE_DAYS:-7}
      AGENTGUARD_ARCHIVE_BATCH_SIZE: ${AGENTGUARD_ARCHIVE_BATCH_SIZE:-100}
      AGENTGUARD_ARCHIVE_MAX_PLAINTEXT_BYTES: ${AGENTGUARD_ARCHIVE_MAX_PLAINTEXT_BYTES:-67108864}
      AGENTGUARD_ARCHIVE_MAX_OBJECT_BYTES: ${AGENTGUARD_ARCHIVE_MAX_OBJECT_BYTES:-100663296}
      AGENTGUARD_ARCHIVE_MAX_DECOMPRESSED_BYTES: ${AGENTGUARD_ARCHIVE_MAX_DECOMPRESSED_BYTES:-67108864}
      AGENTGUARD_ARCHIVE_INTERVAL_SECONDS: ${AGENTGUARD_ARCHIVE_INTERVAL_SECONDS:-300}
      AGENTGUARD_ARCHIVE_LEASE_SECONDS: ${AGENTGUARD_ARCHIVE_LEASE_SECONDS:-60}
      AGENTGUARD_ARCHIVE_REQUEST_TIMEOUT_SECONDS: ${AGENTGUARD_ARCHIVE_REQUEST_TIMEOUT_SECONDS:-10}
      AGENTGUARD_ARCHIVE_REPLICATION_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICATION_ENABLED:-false}
      AGENTGUARD_ARCHIVE_REPLICA_POLICY_VERSION: ${AGENTGUARD_ARCHIVE_REPLICA_POLICY_VERSION:-archive-replica-policy-v1}
      AGENTGUARD_ARCHIVE_MINIMUM_VERIFIED_REPLICAS: ${AGENTGUARD_ARCHIVE_MINIMUM_VERIFIED_REPLICAS:-1}
      AGENTGUARD_ARCHIVE_REPLICA_VERIFICATION_MAX_AGE_SECONDS: ${AGENTGUARD_ARCHIVE_REPLICA_VERIFICATION_MAX_AGE_SECONDS:-86400}
      AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED:-false}
      AGENTGUARD_ARCHIVE_REPLICA_SCRUB_INTERVAL_SECONDS: ${AGENTGUARD_ARCHIVE_REPLICA_SCRUB_INTERVAL_SECONDS:-86400}
      AGENTGUARD_ARCHIVE_REPLICA_REPAIR_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICA_REPAIR_ENABLED:-false}
      AGENTGUARD_ARCHIVE_REPLICA_MAX_ATTEMPTS: ${AGENTGUARD_ARCHIVE_REPLICA_MAX_ATTEMPTS:-10}
      AGENTGUARD_ARCHIVE_REPLICA_LEASE_SECONDS: ${AGENTGUARD_ARCHIVE_REPLICA_LEASE_SECONDS:-60}
      AGENTGUARD_ARCHIVE_REPLICA_RETRY_BASE_SECONDS: ${AGENTGUARD_ARCHIVE_REPLICA_RETRY_BASE_SECONDS:-5}
      AGENTGUARD_ARCHIVE_REPLICA_RETRY_MAX_SECONDS: ${AGENTGUARD_ARCHIVE_REPLICA_RETRY_MAX_SECONDS:-3600}
      AGENTGUARD_ARCHIVE_PRIMARY_STORE_ID: ${AGENTGUARD_ARCHIVE_PRIMARY_STORE_ID:-primary}
      AGENTGUARD_ARCHIVE_STORE_REGISTRY: ${AGENTGUARD_ARCHIVE_STORE_REGISTRY:-}
      AGENTGUARD_LEDGER_COMPACTION_REPLICA_POLICY_ENABLED: ${AGENTGUARD_LEDGER_COMPACTION_REPLICA_POLICY_ENABLED:-false}
      AGENTGUARD_LEDGER_ARCHIVE_ENABLED: ${AGENTGUARD_LEDGER_ARCHIVE_ENABLED:-false}
      AGENTGUARD_LEDGER_COMPACTION_ENABLED: ${AGENTGUARD_LEDGER_COMPACTION_ENABLED:-false}
      AGENTGUARD_LEDGER_SEGMENT_MIN_AGE_DAYS: ${AGENTGUARD_LEDGER_SEGMENT_MIN_AGE_DAYS:-30}
      AGENTGUARD_LEDGER_HOT_TAIL_EVENTS: ${AGENTGUARD_LEDGER_HOT_TAIL_EVENTS:-10}
      AGENTGUARD_LEDGER_SEGMENT_MAX_EVENTS: ${AGENTGUARD_LEDGER_SEGMENT_MAX_EVENTS:-10000}
      AGENTGUARD_LEDGER_COMPACTION_AUTHORIZATION_TTL_SECONDS: ${AGENTGUARD_LEDGER_COMPACTION_AUTHORIZATION_TTL_SECONDS:-60}
      AGENTGUARD_ARCHIVE_STORE_ENDPOINT: ${AGENTGUARD_ARCHIVE_STORE_ENDPOINT:-}
      AGENTGUARD_ARCHIVE_STORE_BUCKET: ${AGENTGUARD_ARCHIVE_STORE_BUCKET:-}
      AGENTGUARD_ARCHIVE_STORE_REGION: ${AGENTGUARD_ARCHIVE_STORE_REGION:-us-east-1}
      AGENTGUARD_ARCHIVE_STORE_ACCESS_KEY: ${AGENTGUARD_ARCHIVE_STORE_ACCESS_KEY:-}
      AGENTGUARD_ARCHIVE_STORE_SECRET_KEY: ${AGENTGUARD_ARCHIVE_STORE_SECRET_KEY:-}
      AGENTGUARD_ARCHIVE_ENCRYPTION_KEYS_FILE: ${AGENTGUARD_ARCHIVE_ENCRYPTION_KEYS_FILE:-/run/secrets/agentguard_archive_encryption_keys}
      AGENTGUARD_ARCHIVE_ENCRYPTION_KEY_ID: ${AGENTGUARD_ARCHIVE_ENCRYPTION_KEY_ID:-archive-key-v1}
      AGENTGUARD_REPLAY_RATE_LIMIT: ${AGENTGUARD_REPLAY_RATE_LIMIT:-30}
    ports:
      - "127.0.0.1:8000:8000"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: agentguard_key_pepper
        target: agentguard_key_pepper
      - source: agentguard_integrity_key
        target: agentguard_integrity_key
      - source: agentguard_database_url
        target: agentguard_database_url
      - source: agentguard_archive_encryption_keys
        target: agentguard_archive_encryption_keys
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    networks:
      backend:
        aliases: [agentguard-server]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      agentguard-migrate:
        condition: service_completed_successfully

  agentguard-retention:
    extends:
      service: agentguard-server
    profiles: [retention]
    command: ["-m", "agentguard_server.retention_worker"]
    ports: []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_retention_database_url
    secrets:
      - source: agentguard_retention_database_url
        target: agentguard_retention_database_url
      - source: agentguard_archive_encryption_keys
        target: agentguard_archive_encryption_keys

  agentguard-ledger-compactor:
    extends:
      service: agentguard-server
    profiles: [ledger]
    command: ["-m", "agentguard_server.ledger_compactor"]
    ports: []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_ledger_compactor_database_url
      AGENTGUARD_INSTANCE_ID: ${AGENTGUARD_LEDGER_COMPACTOR_INSTANCE_ID:-agentguard-ledger-compactor}
    secrets:
      - source: agentguard_ledger_compactor_database_url
        target: agentguard_ledger_compactor_database_url

  agentguard-integrity-compactor:
    extends:
      service: agentguard-server
    profiles: [integrity]
    command: ["-m", "agentguard_server.integrity_compactor"]
    ports: []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_integrity_compactor_database_url
      AGENTGUARD_INSTANCE_ID: ${AGENTGUARD_INTEGRITY_COMPACTOR_INSTANCE_ID:-agentguard-integrity-compactor}
      AGENTGUARD_INTEGRITY_SEGMENT_COMPACTION_ENABLED: ${AGENTGUARD_INTEGRITY_SEGMENT_COMPACTION_ENABLED:-false}
    secrets:
      - source: agentguard_integrity_compactor_database_url
        target: agentguard_integrity_compactor_database_url

  agentguard-replica-worker:
    extends:
      service: agentguard-server
    profiles: [replication]
    command: ["-m", "agentguard_server.replica_worker"]
    ports: []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_replication_database_url
      AGENTGUARD_INSTANCE_ID: ${AGENTGUARD_ARCHIVE_REPLICATION_INSTANCE_ID:-agentguard-replica-worker}
      AGENTGUARD_ARCHIVE_REPLICATION_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICATION_ENABLED:-false}
      AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED:-false}
    secrets:
      - source: agentguard_replication_database_url
        target: agentguard_replication_database_url

  agentguard-replica-scrubber:
    extends:
      service: agentguard-server
    profiles: [replication]
    command: ["-m", "agentguard_server.scrub_worker"]
    ports: []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/agentguard_replication_database_url
      AGENTGUARD_INSTANCE_ID: ${AGENTGUARD_ARCHIVE_SCRUB_INSTANCE_ID:-agentguard-replica-scrubber}
      AGENTGUARD_ARCHIVE_REPLICATION_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICATION_ENABLED:-false}
      AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED: ${AGENTGUARD_ARCHIVE_REPLICA_SCRUBBING_ENABLED:-false}
    secrets:
      - source: agentguard_replication_database_url
        target: agentguard_replication_database_url

networks:
  backend:
    driver: bridge

volumes:
  agentguard-postgres-data:

secrets:
  agentguard_key_pepper:
    file: ${AGENTGUARD_KEY_PEPPER_HOST_FILE:?Set AGENTGUARD_KEY_PEPPER_HOST_FILE}
  agentguard_integrity_key:
    file: ${AGENTGUARD_INTEGRITY_KEY_HOST_FILE:?Set AGENTGUARD_INTEGRITY_KEY_HOST_FILE}
  agentguard_database_url:
    file: ${AGENTGUARD_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_DATABASE_URL_HOST_FILE}
  agentguard_migration_database_url:
    file: ${AGENTGUARD_MIGRATION_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_MIGRATION_DATABASE_URL_HOST_FILE}
  agentguard_retention_database_url:
    file: ${AGENTGUARD_RETENTION_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_RETENTION_DATABASE_URL_HOST_FILE}
  agentguard_archive_encryption_keys:
    file: ${AGENTGUARD_ARCHIVE_ENCRYPTION_KEYS_HOST_FILE:?Set AGENTGUARD_ARCHIVE_ENCRYPTION_KEYS_HOST_FILE}
  agentguard_replication_database_url:
    file: ${AGENTGUARD_ARCHIVE_REPLICATION_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_ARCHIVE_REPLICATION_DATABASE_URL_HOST_FILE}
  agentguard_ledger_compactor_database_url:
    file: ${AGENTGUARD_LEDGER_COMPACTOR_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_LEDGER_COMPACTOR_DATABASE_URL_HOST_FILE}
  agentguard_integrity_compactor_database_url:
    file: ${AGENTGUARD_INTEGRITY_COMPACTOR_DATABASE_URL_HOST_FILE:?Set AGENTGUARD_INTEGRITY_COMPACTOR_DATABASE_URL_HOST_FILE}
