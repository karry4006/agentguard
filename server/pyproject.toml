[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-server"
version = "1.0.0"
description = "AgentGuard HTTP ingestion and trace query service"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "opentelemetry-proto>=1.28,<2",
  "Jinja2>=3.1,<4",
  "Authlib>=1.7.2,<2",
  "joserfc>=1.7.4,<2",
  "cryptography>=42,<51",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/karry4006/agentguard"
Repository = "https://github.com/karry4006/agentguard"
Issues = "https://github.com/karry4006/agentguard/issues"

[project.scripts]
agentguard-server = "agentguard_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


